# Quercus links the pinned FFmpeg 8.1 build statically; a distro/system FFmpeg
# is not supported. Cargo's [env] cannot expand shell variables, so export it
# before building (or use `scripts/build.sh`):
#
#   export FFMPEG_DIR=/path/to/quercus-engine/.cache/ffmpeg
#
# ocio-sys 0.2.1's bundled yaml-cpp does not compile with GCC >= 13
# (`#include <cstdint>` is missing). Link the system OpenColorIO 2.x instead;
# these are Linux defaults, override them for other prefixes.
[env]
OCIO_INSTALL_DIR = "/usr"
OCIO_RS_LINK = "dynamic"
