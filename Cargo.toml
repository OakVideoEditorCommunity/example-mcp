[package]
name = "oak-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Model Context Protocol server exposing the Quercus video-editing engine (quercus-engine-rs) as tools"
license = "GPL-3.0-or-later"
repository = "https://github.com/OakVideoEditorCommunity/example-mcp"
keywords = ["mcp", "video", "editor", "nle", "quercus"]
categories = ["multimedia::video", "command-line-utilities"]

[[bin]]
name = "oak-mcp"
path = "src/main.rs"

[dependencies]
quercus-engine-rs = "0.5.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
thiserror = "2"


# The engine links FFmpeg statically and its dependency tree is large; a small
# amount of optimization keeps preview/render/export usable in a debug build.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
panic = "unwind"
